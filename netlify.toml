[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Production deploys MUST override this to "supabase" — see README §Data layer.
  # The in-memory store does not persist across Netlify Functions cold starts.
  DATA_STORE = "memory"

# WenMeet is hosted on Netlify (see PRD §15). The app is also Dockerized
# independently (see Dockerfile) so the same image can run on Netlify,
# a container host, or locally without a rebuild.
